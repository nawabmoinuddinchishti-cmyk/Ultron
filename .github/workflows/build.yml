name: Build EXE
on: push
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyQt5 pyttsx3 psutil pyinstaller
      - run: pyinstaller --onefile --windowed --name UltronGUI ultron_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: UltronGUI-exe
          path: dist/UltronGUI.exe
